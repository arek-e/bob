name: Release gate

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full reviewed commit SHA from main
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      BAO_ADDR: ${{ vars.BAO_ADDR }}
      BAO_JWT_ROLE: ${{ vars.BAO_JWT_ROLE }}
      SENDBLUE_ACCOUNT_ID: ${{ secrets.SENDBLUE_ACCOUNT_ID }}
      SENDBLUE_LINE_ID: ${{ secrets.SENDBLUE_LINE_ID }}
      BOB_RELEASE_SHA: ${{ inputs.release_sha }}
      ALCHEMY_TELEMETRY_DISABLED: "true"
      # This reviewed workflow declares the handoff action. A plan does not apply it.
      RUNTIME_CREDENTIAL_HANDOFF_ENABLED: "true"
      CILIUM_FQDN_POLICY_APPROVED: ${{ vars.CILIUM_FQDN_POLICY_APPROVED }}
      BOB_CORE_FQDN: ${{ vars.BOB_CORE_FQDN }}
      OPENBAO_FQDN: ${{ vars.OPENBAO_FQDN }}
      BOB_AGENT_IMAGE_REPOSITORY: ${{ vars.BOB_AGENT_IMAGE_REPOSITORY }}
      BOB_AGENT_IMAGE_DIGEST: ${{ vars.BOB_AGENT_IMAGE_DIGEST }}
      CLOUDFLARED_IMAGE_REPOSITORY: ${{ vars.CLOUDFLARED_IMAGE_REPOSITORY }}
      CLOUDFLARED_IMAGE_DIGEST: ${{ vars.CLOUDFLARED_IMAGE_DIGEST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - name: Verify reviewed release commit
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm secrets:scan:trusted
      - run: pnpm check
      - run: node scripts/verify-deployment-readiness.mjs
      - run: pnpm infra:plan
