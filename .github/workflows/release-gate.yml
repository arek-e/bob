name: Release gate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed source commit SHA from main
        required: true
        type: string
      gitops_sha:
        description: Full GitOps commit SHA from main
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      BAO_ADDR: ${{ vars.BAO_ADDR }}
      BAO_JWT_ROLE: ${{ vars.BAO_JWT_ROLE_PRODUCTION }}
      BOB_RELEASE_SHA: ${{ inputs.source_sha }}
      ALCHEMY_TELEMETRY_DISABLED: "true"
      # This reviewed workflow declares the handoff action. A plan does not apply it.
      RUNTIME_CREDENTIAL_HANDOFF_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.gitops_sha }}
          fetch-depth: 0
      - name: Verify reviewed source and GitOps commits
        id: release_delta
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          GITOPS_SHA: ${{ inputs.gitops_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITOPS_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITOPS_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          git merge-base --is-ancestor "$GITOPS_SHA" origin/main
          git merge-base --is-ancestor "$SOURCE_SHA" "$GITOPS_SHA"

          mapfile -t changed_paths < <(git diff --name-only "$SOURCE_SHA" "$GITOPS_SHA")
          test "${#changed_paths[@]}" -eq 1
          test "${changed_paths[0]}" = "infra/kubernetes/overlays/prod/kustomization.yaml"
          release_delta="$(node scripts/verify-release-gitops-delta.mjs "$SOURCE_SHA" "$GITOPS_SHA")"
          echo "agent_digest=$(jq -er .agentDigest <<<"$release_delta")" >> "$GITHUB_OUTPUT"
          echo "backup_digest=$(jq -er .backupDigest <<<"$release_delta")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bind image pins to the reviewed source commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          OVERLAY_AGENT_DIGEST: ${{ steps.release_delta.outputs.agent_digest }}
          OVERLAY_BACKUP_DIGEST: ${{ steps.release_delta.outputs.backup_digest }}
        shell: bash
        run: |
          set -euo pipefail
          agent_digest="$(docker buildx imagetools inspect \
            --format '{{.Manifest.Digest}}' \
            "ghcr.io/arek-e/bob-agent:sha-$SOURCE_SHA")"
          backup_digest="$(docker buildx imagetools inspect \
            --format '{{.Manifest.Digest}}' \
            "ghcr.io/arek-e/bob-data-backup:sha-$SOURCE_SHA")"
          [[ "$agent_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$backup_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$agent_digest" = "$OVERLAY_AGENT_DIGEST"
          test "$backup_digest" = "$OVERLAY_BACKUP_DIGEST"
      - name: Connect to the production Tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID_PRODUCTION }}
          audience: ${{ vars.TS_AUDIENCE_PRODUCTION }}
          tags: tag:ci
          ping: vault.lamb-bicolor.ts.net
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm secrets:scan:trusted
      - run: pnpm check
      - run: pnpm secrets:scan:trusted
      - run: node scripts/verify-deployment-readiness.mjs
      - run: pnpm infra:plan
