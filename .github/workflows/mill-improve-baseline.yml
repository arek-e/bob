name: Mill Improve fixture / baseline

on:
  push:
    branches:
      - mill/mil-39-repair-fixture

permissions:
  contents: read

jobs:
  service-readiness:
    name: service-readiness (baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run fixed-sleep baseline
        run: bash .github/mill-improve/run-readiness.sh baseline
