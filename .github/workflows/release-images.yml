name: Release images

on:
  workflow_call:
    inputs:
      release_sha:
        description: Full main-branch commit SHA to build and attest
        required: true
        type: string
    outputs:
      agent_digest:
        description: Immutable agent image digest
        value: ${{ jobs.publish-agent.outputs.digest }}
      backup_digest:
        description: Immutable backup image digest
        value: ${{ jobs.publish-backup.outputs.digest }}
      bundle_digest:
        description: Canonical Runtime release bundle digest
        value: ${{ jobs.publish-bundle.outputs.bundle_digest }}
      bundle_reference:
        description: Immutable OCI Runtime release bundle reference
        value: ${{ jobs.publish-bundle.outputs.bundle_reference }}
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full main-branch commit SHA to build and attest
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  publish-agent:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.agent.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Verify release SHA
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish agent
        id: agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/arek-e/bob-agent:sha-${{ inputs.release_sha }}
          build-args: NODE_IMAGE=node:22.19.0-bookworm-slim@sha256:4a4884e8a44826194dff92ba316264f392056cbe243dcc9fd3551e71cea02b90
          cache-from: type=gha,scope=bob-agent
          cache-to: type=gha,mode=min,scope=bob-agent
          provenance: mode=max
          sbom: true

  publish-backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.backup.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Verify release SHA
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backup
        id: backup
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/data-backup/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/arek-e/bob-data-backup:sha-${{ inputs.release_sha }}
          cache-from: type=gha,scope=bob-data-backup
          cache-to: type=gha,mode=min,scope=bob-data-backup
          provenance: mode=max
          sbom: true

  verify:
    needs: [publish-agent, publish-backup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify OCI platform and attestation manifests
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          AGENT_DIGEST: ${{ needs.publish-agent.outputs.digest }}
          BACKUP_DIGEST: ${{ needs.publish-backup.outputs.digest }}
        run: |
          set -euo pipefail

          verify_image() {
            local repository="$1"
            local digest="$2"
            local reference="${repository}@${digest}"
            local index_json
            local subject_digest
            local attestation_digest
            local attestation_json
            local provenance_json

            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            index_json="$(docker buildx imagetools inspect --raw "$reference")"
            provenance_json="$(
              docker buildx imagetools inspect --format '{{json .Provenance}}' "$reference"
            )"

            jq -e '
              .mediaType == "application/vnd.oci.image.index.v1+json" and
              ([
                .manifests[] |
                select(.annotations["vnd.docker.reference.type"] != "attestation-manifest") |
                [.platform.os, .platform.architecture]
              ] | sort) == [["linux", "amd64"], ["linux", "arm64"]] and
              ([
                .manifests[] |
                select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")
              ] | length) == 2 and
              all(
                .manifests[];
                .mediaType == "application/vnd.oci.image.manifest.v1+json"
              )
            ' <<<"$index_json" >/dev/null
            jq -e --arg release_sha "$RELEASE_SHA" '
              (keys | sort) == ["linux/amd64", "linux/arm64"] and
              all(
                .[];
                .SLSA.buildDefinition.externalParameters.request.root.request.args["vcs:revision"] == $release_sha and
                .SLSA.buildDefinition.externalParameters.request.root.request.args["vcs:source"] == "https://github.com/arek-e/bob"
              )
            ' <<<"$provenance_json" >/dev/null

            while IFS= read -r subject_digest; do
              attestation_digest="$(
                jq -er --arg subject "$subject_digest" '
                  [
                    .manifests[] |
                    select(
                      .annotations["vnd.docker.reference.type"] == "attestation-manifest" and
                      .annotations["vnd.docker.reference.digest"] == $subject
                    ) |
                    .digest
                  ] |
                  if length == 1 then .[0] else error("invalid attestation subject") end
                ' <<<"$index_json"
              )"
              attestation_json="$(
                docker buildx imagetools inspect --raw "${repository}@${attestation_digest}"
              )"
              jq -e '
                .mediaType == "application/vnd.oci.image.manifest.v1+json" and
                (.layers | length) == 2 and
                ([
                  .layers[] |
                  select(
                    .mediaType == "application/vnd.in-toto+json" and
                    .annotations["in-toto.io/predicate-type"] == "https://spdx.dev/Document"
                  )
                ] | length) == 1 and
                ([
                  .layers[] |
                  select(
                    .mediaType == "application/vnd.in-toto+json" and
                    .annotations["in-toto.io/predicate-type"] == "https://slsa.dev/provenance/v1"
                  )
                ] | length) == 1
              ' <<<"$attestation_json" >/dev/null
            done < <(
              jq -r '
                .manifests[] |
                select(
                  .platform.os == "linux" and
                  (.platform.architecture == "amd64" or .platform.architecture == "arm64")
                ) |
                .digest
              ' <<<"$index_json"
            )
          }

          verify_image ghcr.io/arek-e/bob-agent "$AGENT_DIGEST"
          verify_image ghcr.io/arek-e/bob-data-backup "$BACKUP_DIGEST"

      - name: Record immutable release references
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          AGENT_DIGEST: ${{ needs.publish-agent.outputs.digest }}
          BACKUP_DIGEST: ${{ needs.publish-backup.outputs.digest }}
        run: |
          {
            echo "Release SHA: $RELEASE_SHA"
            echo "Agent: ghcr.io/arek-e/bob-agent@$AGENT_DIGEST"
            echo "Backup: ghcr.io/arek-e/bob-data-backup@$BACKUP_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-bundle:
    needs: [publish-agent, publish-backup, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      bundle_digest: ${{ steps.bundle.outputs.bundle_digest }}
      bundle_reference: ${{ steps.bundle.outputs.bundle_reference }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
      - uses: oras-project/setup-oras@v1
        with:
          version: 1.3.3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the immutable Runtime release bundle
        id: bundle
        env:
          SOURCE_SHA: ${{ inputs.release_sha }}
          AGENT_DIGEST: ${{ needs.publish-agent.outputs.digest }}
          BACKUP_DIGEST: ${{ needs.publish-backup.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          bundle_digest="$(node scripts/release-bundle.mjs create release-bundle.json)"
          bundle_tag="ghcr.io/arek-e/bob-release:sha-${SOURCE_SHA}"
          oras push "$bundle_tag" \
            --artifact-type application/vnd.bob.runtime.release.v1+json \
            release-bundle.json:application/vnd.bob.runtime.release.v1+json
          artifact_digest="$(oras resolve "$bundle_tag")"
          [[ "$bundle_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          bundle_reference="ghcr.io/arek-e/bob-release@${artifact_digest}"
          echo "bundle_digest=$bundle_digest" >> "$GITHUB_OUTPUT"
          echo "bundle_reference=$bundle_reference" >> "$GITHUB_OUTPUT"
          {
            echo "Release bundle: $bundle_reference"
            echo "Bundle content digest: $bundle_digest"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bob-release-${{ inputs.release_sha }}
          path: release-bundle.json
          if-no-files-found: error
          retention-days: 90
