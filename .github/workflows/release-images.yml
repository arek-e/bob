name: Release images

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full main-branch commit SHA to build and attest
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-images-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Verify release SHA
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish agent
        id: agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/arek-e/bob-agent:sha-${{ inputs.release_sha }}
          build-args: NODE_IMAGE=node:22.19.0-bookworm-slim@sha256:4a4884e8a44826194dff92ba316264f392056cbe243dcc9fd3551e71cea02b90
          cache-from: type=gha,scope=bob-agent
          cache-to: type=gha,mode=max,scope=bob-agent
          provenance: mode=max
          sbom: true

      - name: Attest agent image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/arek-e/bob-agent
          subject-digest: ${{ steps.agent.outputs.digest }}
          push-to-registry: true

      - name: Build and publish backup
        id: backup
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/data-backup/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/arek-e/bob-data-backup:sha-${{ inputs.release_sha }}
          cache-from: type=gha,scope=bob-data-backup
          cache-to: type=gha,mode=max,scope=bob-data-backup
          provenance: mode=max
          sbom: true

      - name: Attest backup image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/arek-e/bob-data-backup
          subject-digest: ${{ steps.backup.outputs.digest }}
          push-to-registry: true

      - name: Record immutable release references
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          AGENT_DIGEST: ${{ steps.agent.outputs.digest }}
          BACKUP_DIGEST: ${{ steps.backup.outputs.digest }}
        run: |
          {
            echo "Release SHA: $RELEASE_SHA"
            echo "Agent: ghcr.io/arek-e/bob-agent@$AGENT_DIGEST"
            echo "Backup: ghcr.io/arek-e/bob-data-backup@$BACKUP_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
