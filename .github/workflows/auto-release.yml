name: Prepare Runtime release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: bob-runtime-release-preparation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  select-source:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.BOB_RELEASE_PREPARATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Select the current reviewed source
        id: source
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SOURCE_SHA"

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  build-images:
    needs: select-source
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-images.yml
    with:
      release_sha: ${{ needs.select-source.outputs.source_sha }}

  record-release:
    needs: [select-source, build-images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record the immutable release bundle
        env:
          SOURCE_SHA: ${{ needs.select-source.outputs.source_sha }}
          AGENT_DIGEST: ${{ needs.build-images.outputs.agent_digest }}
          BACKUP_DIGEST: ${{ needs.build-images.outputs.backup_digest }}
          BUNDLE_DIGEST: ${{ needs.build-images.outputs.bundle_digest }}
          BUNDLE_REFERENCE: ${{ needs.build-images.outputs.bundle_reference }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AGENT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$BACKUP_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$BUNDLE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$BUNDLE_REFERENCE" =~ ^ghcr.io/arek-e/bob-release@sha256:[0-9a-f]{64}$ ]]

          {
            echo "Runtime release artifacts are ready for the private Control Plane."
            echo "Source SHA: $SOURCE_SHA"
            echo "Agent digest: $AGENT_DIGEST"
            echo "Backup digest: $BACKUP_DIGEST"
            echo "Release bundle: $BUNDLE_REFERENCE"
            echo "Bundle content digest: $BUNDLE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
