name: Release Runtime

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: bob-runtime-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: read

jobs:
  select-source:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.BOB_AUTO_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Select the current reviewed source
        id: source
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SOURCE_SHA"

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  build-images:
    needs: select-source
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-images.yml
    with:
      release_sha: ${{ needs.select-source.outputs.source_sha }}

  record-release:
    needs: [select-source, build-images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record the immutable release bundle
        env:
          SOURCE_SHA: ${{ needs.select-source.outputs.source_sha }}
          AGENT_DIGEST: ${{ needs.build-images.outputs.agent_digest }}
          BACKUP_DIGEST: ${{ needs.build-images.outputs.backup_digest }}
          BUNDLE_DIGEST: ${{ needs.build-images.outputs.bundle_digest }}
          BUNDLE_REFERENCE: ${{ needs.build-images.outputs.bundle_reference }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AGENT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$BACKUP_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$BUNDLE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$BUNDLE_REFERENCE" =~ ^ghcr.io/arek-e/bob-release@sha256:[0-9a-f]{64}$ ]]

          {
            echo "Runtime release artifacts are ready for Coolify."
            echo "Source SHA: $SOURCE_SHA"
            echo "Agent digest: $AGENT_DIGEST"
            echo "Backup digest: $BACKUP_DIGEST"
            echo "Release bundle: $BUNDLE_REFERENCE"
            echo "Bundle content digest: $BUNDLE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    needs: [select-source, build-images]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      BAO_ADDR: ${{ vars.BAO_ADDR }}
      BAO_JWT_ROLE: ${{ vars.BAO_JWT_ROLE_AUTO_RELEASE }}
      AGENT_ADMIN_ORIGIN_URL: ${{ vars.AGENT_ADMIN_ORIGIN_URL }}
      COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
      COOLIFY_HOST_ADDRESS: ${{ vars.COOLIFY_HOST_ADDRESS }}
      COOLIFY_RUNTIME_APPLICATION_UUID: ${{ vars.COOLIFY_RUNTIME_APPLICATION_UUID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select-source.outputs.source_sha }}
          fetch-depth: 1

      - uses: oras-project/setup-oras@v1
        with:
          version: 1.3.0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the immutable release bundle
        env:
          BUNDLE_REFERENCE: ${{ needs.build-images.outputs.bundle_reference }}
          EXPECTED_SOURCE_SHA: ${{ needs.select-source.outputs.source_sha }}
          EXPECTED_AGENT_DIGEST: ${{ needs.build-images.outputs.agent_digest }}
          EXPECTED_BACKUP_DIGEST: ${{ needs.build-images.outputs.backup_digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUNDLE_REFERENCE" =~ ^ghcr.io/arek-e/bob-release@sha256:[0-9a-f]{64}$ ]]
          mkdir runtime-release
          oras pull "$BUNDLE_REFERENCE" --output runtime-release
          test -f runtime-release/release-bundle.json
          test "$(find runtime-release -type f | wc -l | tr -d ' ')" = "1"
          verified_bundle="$(node scripts/release-bundle.mjs verify runtime-release/release-bundle.json)"
          jq -e \
            --arg source "$EXPECTED_SOURCE_SHA" \
            --arg agent "$EXPECTED_AGENT_DIGEST" \
            --arg backup "$EXPECTED_BACKUP_DIGEST" \
            '.bundle.sourceRevision == $source and
             (.bundle.runtimeImages | any(.name == "agent" and .digest == $agent)) and
             (.bundle.runtimeImages | any(.name == "backup" and .digest == $backup))' \
            <<<"$verified_bundle" >/dev/null

      - name: Connect to the production Tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID_AUTO_RELEASE }}
          audience: ${{ vars.TS_AUDIENCE_AUTO_RELEASE }}
          tags: tag:ci
          ping: vault.lamb-bicolor.ts.net

      - name: Deploy the reviewed bundle through Coolify
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.select-source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for name in BAO_ADDR BAO_JWT_ROLE AGENT_ADMIN_ORIGIN_URL COOLIFY_BASE_URL COOLIFY_HOST_ADDRESS COOLIFY_RUNTIME_APPLICATION_UUID; do
            test -n "${!name}" || { echo "Missing production variable: ${name}" >&2; exit 1; }
          done
          coolify_host="$(node -e 'process.stdout.write(new URL(process.env.COOLIFY_BASE_URL).hostname)')"
          printf '%s %s\n' "$COOLIFY_HOST_ADDRESS" "$coolify_host" | sudo tee -a /etc/hosts >/dev/null
          tailscale ping --timeout=10s "$COOLIFY_HOST_ADDRESS" >/dev/null
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SOURCE_SHA"

          bao_token=""
          cleanup() {
            unset COOLIFY_API_TOKEN AGENT_ADMIN_ACCESS_CLIENT_ID AGENT_ADMIN_ACCESS_CLIENT_SECRET
            if [[ -n "${bao_token:-}" ]]; then
              curl --silent --show-error --connect-timeout 10 --max-time 10 --request POST \
                --header "X-Vault-Token: ${bao_token}" \
                "${BAO_ADDR%/}/v1/auth/token/revoke-self" >/dev/null || true
            fi
          }
          trap cleanup EXIT

          oidc_jwt="$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=openbao" | jq -er '.value')"
          login_response="$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
            --request POST \
            --header 'content-type: application/json' \
            --data "$(jq -nc --arg role "$BAO_JWT_ROLE" --arg jwt "$oidc_jwt" '{role: $role, jwt: $jwt}')" \
            "${BAO_ADDR%/}/v1/auth/jwt/login")"
          bao_token="$(jq -er '.auth.client_token' <<<"$login_response")"

          coolify_record="$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
            --header "X-Vault-Token: ${bao_token}" \
            "${BAO_ADDR%/}/v1/ops/data/apps/prod/bob/control-plane/coolify")"
          admin_record="$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
            --header "X-Vault-Token: ${bao_token}" \
            "${BAO_ADDR%/}/v1/ops/data/apps/prod/bob/access/core-to-agent-admin")"
          export COOLIFY_API_TOKEN="$(jq -er '.data.data.COOLIFY_API_TOKEN' <<<"$coolify_record")"
          export AGENT_ADMIN_ACCESS_CLIENT_ID="$(jq -er '.data.data.AGENT_ADMIN_ACCESS_CLIENT_ID' <<<"$admin_record")"
          export AGENT_ADMIN_ACCESS_CLIENT_SECRET="$(jq -er '.data.data.AGENT_ADMIN_ACCESS_CLIENT_SECRET' <<<"$admin_record")"
          echo "::add-mask::${COOLIFY_API_TOKEN}"
          echo "::add-mask::${AGENT_ADMIN_ACCESS_CLIENT_ID}"
          echo "::add-mask::${AGENT_ADMIN_ACCESS_CLIENT_SECRET}"

          result="$(node scripts/coolify-release.mjs runtime-release/release-bundle.json)"
          deployment_id="$(jq -er '.deploymentId' <<<"$result")"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SOURCE_SHA"
          {
            echo "Production deployment: ${deployment_id}"
            echo "Source SHA: ${EXPECTED_SOURCE_SHA}"
            echo "Readiness: passed"
          } >> "$GITHUB_STEP_SUMMARY"
