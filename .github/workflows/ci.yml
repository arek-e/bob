name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  packages: read

jobs:
  checks:
    name: checks (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - name: quality
            command: pnpm format:check && pnpm lint && pnpm build
          - name: typecheck
            command: pnpm typecheck
          - name: unit-tests
            command: pnpm test:unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://npm.pkg.github.com
      - name: Resolve package credential
        id: package_auth
        uses: ./.github/actions/package-auth
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ steps.package_auth.outputs.node_auth_token || secrets.TEAMPITCH_PACKAGES_TOKEN }}
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  verify:
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          test "$CHECKS_RESULT" = success
