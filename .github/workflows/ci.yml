name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - name: quality
            command: pnpm check:static && pnpm eval:offline && pnpm build:artifacts && pnpm ui:safety
          - name: typecheck
            command: pnpm typecheck
          - name: unit-tests
            command: pnpm test:unit
          - name: worker-tests
            command: pnpm test:workers
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  alchemy-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Probe pinned Alchemy and Effect runtime
        run: pnpm infra:load

  verify:
    if: always()
    needs: [checks, alchemy-compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful checks
        env:
          ALCHEMY_RESULT: ${{ needs.alchemy-compatibility.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$ALCHEMY_RESULT" = success

  trusted-infra-plan:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-readonly
    permissions:
      contents: read
      id-token: write
    env:
      BAO_ADDR: ${{ vars.BAO_ADDR }}
      BAO_JWT_ROLE: ${{ vars.BAO_JWT_ROLE_READONLY }}
      BOB_RELEASE_SHA: ${{ github.sha }}
      ALCHEMY_TELEMETRY_DISABLED: "true"
      # This trusted production job declares the handoff action. A plan does not apply it.
      RUNTIME_CREDENTIAL_HANDOFF_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Connect to the production Tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID_READONLY }}
          audience: ${{ vars.TS_AUDIENCE_READONLY }}
          tags: tag:ci
          ping: vault.lamb-bicolor.ts.net
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build production artifacts
        run: pnpm build:artifacts
      - name: Scan trusted production inputs
        run: pnpm secrets:scan:trusted
      - name: Plan Bob application infrastructure
        run: pnpm infra:plan
      - name: Plan evaluation storage
        run: pnpm infra:evals:plan
