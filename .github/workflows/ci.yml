name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - name: quality
            command: pnpm format:check && pnpm lint && pnpm build
          - name: typecheck
            command: pnpm typecheck
          - name: unit-tests
            command: pnpm test:unit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
      - name: Mill Improve recovery fixture
        if: ${{ github.run_attempt == 1 && matrix.name == 'unit-tests' }}
        run: |
          echo "service readiness failed: database not ready"
          exit 1
      - name: Mill Improve transformation fixture
        if: ${{ matrix.name == 'unit-tests' && false }}
        run: |
          docker compose up -d
          sleep 15

  verify:
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          test "$CHECKS_RESULT" = success
