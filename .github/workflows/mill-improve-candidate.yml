name: Mill Improve fixture / candidate

on:
  push:
    branches:
      - mill/mil-39-repair-fixture

permissions:
  contents: read

jobs:
  service-readiness:
    name: service-readiness (candidate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run health-aware candidate
        run: bash .github/mill-improve/run-readiness.sh candidate
