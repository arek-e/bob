name: Mill Improve fixture / recovery

on:
  push:
    branches:
      - mill/mil-39-repair-fixture

permissions:
  contents: read

jobs:
  service-readiness:
    name: service-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run fixed-sleep baseline
        if: ${{ github.run_attempt == 1 }}
        run: bash .github/mill-improve/run-readiness.sh baseline

      - name: Run readiness-gated candidate
        if: ${{ github.run_attempt > 1 }}
        run: bash .github/mill-improve/run-readiness.sh candidate
