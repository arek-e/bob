services:
  readiness-fixture:
    image: alpine:3.20
    command:
      - sh
      - -ec
      - |
        touch /tmp/not-ready
        sleep 5
        rm /tmp/not-ready
        while true; do sleep 3600; done
    healthcheck:
      test: ["CMD-SHELL", "test ! -e /tmp/not-ready"]
      interval: 1s
      timeout: 1s
      retries: 10
