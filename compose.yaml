name: bob-runtime

x-runtime-security: &runtime-security
  cap_drop: [ALL]
  read_only: true
  restart: unless-stopped
  security_opt: [no-new-privileges:true]

services:
  openbao:
    <<: *runtime-security
    image: openbao/openbao:2.6.0
    command: [server, -dev, -dev-no-store-token]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_DEV_ROOT_TOKEN:?}
    healthcheck:
      test: [CMD, bao, status]
      interval: 3s
      timeout: 2s
      retries: 20
    networks: [runtime]
    tmpfs: [/tmp]

  openbao-bootstrap:
    image: openbao/openbao:2.6.0
    entrypoint: [/bin/sh]
    command: [/config/bootstrap.sh]
    depends_on:
      openbao: { condition: service_healthy }
    environment:
      BAO_ADDR: http://openbao:8200
      OPENBAO_DEV_ROOT_TOKEN: ${OPENBAO_DEV_ROOT_TOKEN:?}
    networks: [runtime]
    restart: no
    user: "0:0"
    volumes:
      - ./iac/openbao:/config:ro
      - openbao-agent-credentials:/run/bob-secrets
      - ${CODEX_CREDENTIAL_FILE:-/dev/null}:/run/codex/credential.json:ro

  telemetry:
    <<: *runtime-security
    image: otel/opentelemetry-collector:0.157.0
    command: [--config=/etc/otelcol/config.yaml]
    networks: [runtime]
    volumes:
      - ./iac/opentelemetry/collector.yaml:/etc/otelcol/config.yaml:ro

  db:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: bob
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_USER: bob
    healthcheck:
      test: [CMD-SHELL, pg_isready -U bob -d bob]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [runtime]
    volumes: [db-data:/var/lib/postgresql/data]

  job-queue:
    image: redis:8.2.1-alpine@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232
    command: [redis-server, --appendonly, "yes"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [runtime]
    volumes: [job-queue-data:/data]

  core:
    <<: *runtime-security
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    depends_on:
      db: { condition: service_healthy }
      job-queue: { condition: service_healthy }
    environment:
      AGENT_CALLER_SECRET: ${AGENT_CALLER_SECRET:?}
      AGENT_URL: http://agent:8787
      ASSETS_DIRECTORY: /app/ui
      AUTO_ENQUEUE_INBOUND: "false"
      BOB_DAILY_TOKEN_BUDGET: ${BOB_DAILY_TOKEN_BUDGET:-250000}
      BOB_MODEL: ${BOB_MODEL:?}
      BOB_RUN_TOKEN_BUDGET: ${BOB_RUN_TOKEN_BUDGET:-32000}
      DATABASE_URL: postgres://bob:${POSTGRES_PASSWORD:?}@db:5432/bob
      DATA_KEK_ACTIVE_VERSION: ${DATA_KEK_ACTIVE_VERSION:?}
      DATA_KEK_KEYRING_JSON: ${DATA_KEK_KEYRING_JSON:?}
      DATA_LOOKUP_KEY: ${DATA_LOOKUP_KEY:?}
      EGRESS_CALLER_SECRET: ${EGRESS_CALLER_SECRET:?}
      INGRESS_CALLER_SECRET: ${INGRESS_CALLER_SECRET:?}
      OWNER_ID: ${OWNER_ID:?}
      OWNER_ACCESS_EMAIL: ${OWNER_ACCESS_EMAIL:?}
      OWNER_TIME_ZONE: ${OWNER_TIME_ZONE:-Europe/Stockholm}
      PORT: "8788"
      OBJECT_STORAGE_DIRECTORY: /data/object-storage
      JOB_QUEUE_URL: redis://job-queue:6379
      SCHEDULER_INTERVAL_MS: ${SCHEDULER_INTERVAL_MS:-60000}
      SETUP_TOKEN: ${SETUP_TOKEN:?}
      CHANNEL_EGRESS_URL: http://channel:8786
      UI_BASE_URL: ${UI_BASE_URL:-http://127.0.0.1:8788}
    expose: ["8788"]
    ports: ["127.0.0.1:8788:8788"]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8788/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [runtime]
    tmpfs: [/tmp]
    volumes: [object-storage-data:/data/object-storage]

  agent:
    <<: *runtime-security
    build:
      context: .
      dockerfile: apps/agent-worker/Dockerfile
    depends_on:
      openbao-bootstrap: { condition: service_completed_successfully }
      telemetry: { condition: service_started }
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_APPROLE_ROLE_ID: bob-agent
      BAO_APPROLE_SECRET_ID_PATH: /run/bob-secrets/openbao_approle_secret_id
      BAO_AUTH_METHOD: approle
      BOB_ALLOWED_MODELS: ${BOB_ALLOWED_MODELS:?}
      BOB_MODEL: ${BOB_MODEL:?}
      BOB_PROVIDER: openai-codex
      BOB_RELEASE_SHA: ${BOB_RELEASE_SHA:?}
      CORE_CALLER_SECRET: ${AGENT_CALLER_SECRET:?}
      CORE_URL: http://core:8788
      OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry:4318
      PORT: "8787"
      RUNTIME_SHARED_SECRET: ${AGENT_CALLER_SECRET:?}
    expose: ["8787"]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [runtime]
    tmpfs: [/tmp]
    volumes:
      - openbao-agent-credentials:/run/bob-secrets:ro

  channel:
    <<: *runtime-security
    build:
      context: .
      dockerfile: apps/channel/Dockerfile
    depends_on:
      core: { condition: service_healthy }
      job-queue: { condition: service_healthy }
    environment:
      BOB_RELEASE_SHA: ${BOB_RELEASE_SHA:?}
      CORE_CALLER_SECRET: ${EGRESS_CALLER_SECRET:?}
      CORE_URL: http://core:8788
      PORT: "8786"
      JOB_QUEUE_URL: redis://job-queue:6379
      SENDBLUE_ACCOUNT_ID: ${SENDBLUE_ACCOUNT_ID:?}
      SENDBLUE_ALLOWED_USER_NUMBER: ${SENDBLUE_ALLOWED_USER_NUMBER:?}
      SENDBLUE_API_KEY_ID: ${SENDBLUE_API_KEY_ID:?}
      SENDBLUE_API_SECRET_KEY: ${SENDBLUE_API_SECRET_KEY:?}
      SENDBLUE_FROM_NUMBER: ${SENDBLUE_FROM_NUMBER:?}
      SENDBLUE_LINE_ID: ${SENDBLUE_LINE_ID:?}
      SENDBLUE_STATUS_CALLBACK_URL: ${SENDBLUE_STATUS_CALLBACK_URL:?}
      SENDBLUE_WEBHOOK_SIGNING_SECRET: ${SENDBLUE_WEBHOOK_SIGNING_SECRET:?}
    expose: ["8786"]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8786/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [runtime]
    tmpfs: [/tmp]

networks:
  runtime:

volumes:
  db-data:
  object-storage-data:
  job-queue-data:
  openbao-agent-credentials:
