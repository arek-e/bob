services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mill_live
      POSTGRES_PASSWORD: mill_live
      POSTGRES_USER: mill_live
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mill_live -d mill_live"]
      interval: 1s
      timeout: 1s
      retries: 20
      start_period: 6s
