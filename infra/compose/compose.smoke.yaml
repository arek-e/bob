services:
  core:
    environment:
      AUTO_ENQUEUE_INBOUND: "true"
    ports: ["127.0.0.1:18789:8788"]
  agent:
    build:
      context: ../..
      dockerfile: apps/compose-smoke-agent/Dockerfile
    environment: !reset null
  channel:
    build:
      context: ../..
      dockerfile: apps/compose-smoke-channel/Dockerfile
    depends_on:
      core: { condition: service_healthy }
      job-queue: { condition: service_healthy }
    environment:
      CORE_URL: http://core:8788
      EGRESS_CALLER_SECRET: ${EGRESS_CALLER_SECRET:?}
      JOB_QUEUE_URL: redis://job-queue:6379
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8786/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [runtime]
    ports: ["127.0.0.1:18790:8786"]
