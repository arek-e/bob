apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bob
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: bob
  source:
    repoURL: git@github.com:arek-e/bob.git
    targetRevision: 2605f87c64cc9da41a9492c75f9ebf7c3e060fc5
    path: infra/kubernetes/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: bob
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
