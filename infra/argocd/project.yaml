apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bob
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Bob production workload
  sourceRepos:
    - git@github.com:arek-e/bob.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: bob
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: PersistentVolumeClaim
    - group: apps
      kind: Deployment
    - group: batch
      kind: CronJob
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: external-secrets.io
      kind: ExternalSecret
    - group: external-secrets.io
      kind: SecretStore
    - group: cilium.io
      kind: CiliumNetworkPolicy
  orphanedResources:
    warn: true
