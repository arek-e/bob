name: bob-private-runtime

x-observer-config: &observer-config |-
  extensions:
    health_check:
      endpoint: 0.0.0.0:13133

  receivers:
    host_metrics:
      collection_interval: 30s
      root_path: /hostfs
      scrapers:
        cpu:
        disk:
        filesystem:
          exclude_fs_types:
            fs_types:
              [
                autofs,
                binfmt_misc,
                cgroup2,
                configfs,
                debugfs,
                devpts,
                devtmpfs,
                fusectl,
                hugetlbfs,
                mqueue,
                overlay,
                proc,
                pstore,
                securityfs,
                squashfs,
                sysfs,
                tracefs
              ]
            match_type: strict
        load:
          cpu_average: true
        memory:
        network:
        paging:
        processes:
        system:

    docker_stats:
      endpoint: unix:///var/run/docker.sock
      collection_interval: 30s
      timeout: 10s
      container_labels_to_metric_labels:
        com.docker.compose.service: bob_service
        coolify.managed: coolify_managed
      metrics:
        container.memory.fails:
          enabled: true
        container.restarts:
          enabled: true
        container.uptime:
          enabled: true

    http_check:
      collection_interval: 30s
      metrics:
        httpcheck.response.duration:
          enabled: true
        httpcheck.tls.cert_remaining:
          enabled: true
      targets:
        - endpoints:
            - http://agent:8787/health
            - http://nango:3003/health
            - http://coolify:8080/api/health
            - https://nango.tpops.dev/health
            - https://bob-agent.tpops.dev/health
            - https://bob-sendblue.tpops.dev/health

    tcp_check:
      collection_interval: 30s
      targets:
        - endpoint: "${NANGO_DB_HOST:?}:${NANGO_DB_PORT:-5432}"
          dialer:
            timeout: 5s
        - endpoint: nango-redis:6379
          dialer:
            timeout: 5s

    file_stats/bob_backup:
      include: /backups
      collection_interval: 1m

    file_stats/nango_backup:
      include: /nango-backups
      collection_interval: 1m

    prometheus/collector:
      config:
        scrape_configs:
          - job_name: bob-coolify-observer
            scrape_interval: 30s
            static_configs:
              - targets: [127.0.0.1:8888]

  processors:
    memory_limiter:
      check_interval: 5s
      limit_mib: 384
      spike_limit_mib: 96
    resource:
      attributes:
        - action: upsert
          key: deployment.environment.name
          value: prod
        - action: upsert
          key: host.name
          value: bob-coolify
        - action: upsert
          key: service.name
          value: bob-coolify-observer
        - action: upsert
          key: service.namespace
          value: bob
    resource/bob_backup:
      attributes:
        - action: upsert
          key: backup.type
          value: bob
    resource/nango_backup:
      attributes:
        - action: upsert
          key: backup.type
          value: nango
    transform/bob_backup:
      error_mode: propagate
      metric_statements:
        - context: datapoint
          statements:
            - set(attributes["backup_type"], "bob")
    transform/nango_backup:
      error_mode: propagate
      metric_statements:
        - context: datapoint
          statements:
            - set(attributes["backup_type"], "nango")
    batch: {}

  exporters:
    otlp_http/platform:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:?}
      timeout: 5s

  service:
    extensions: [health_check]
    pipelines:
      metrics:
        receivers:
          - host_metrics
          - docker_stats
          - http_check
          - tcp_check
          - prometheus/collector
        processors: [memory_limiter, resource, batch]
        exporters: [otlp_http/platform]
      metrics/bob_backup:
        receivers: [file_stats/bob_backup]
        processors: [memory_limiter, resource, resource/bob_backup, transform/bob_backup, batch]
        exporters: [otlp_http/platform]
      metrics/nango_backup:
        receivers: [file_stats/nango_backup]
        processors: [memory_limiter, resource, resource/nango_backup, transform/nango_backup, batch]
        exporters: [otlp_http/platform]
    telemetry:
      logs:
        level: warn
      metrics:
        readers:
          - pull:
              exporter:
                prometheus:
                  host: 127.0.0.1
                  port: 8888

x-runtime-security: &runtime-security
  cap_drop: [ALL]
  read_only: true
  restart: unless-stopped
  security_opt: [no-new-privileges:true]

services:
  agent-secret-init:
    image: ghcr.io/arek-e/bob-agent@${BOB_AGENT_IMAGE_DIGEST:?}
    command:
      - node
      - -e
      - >-
        const fs=require('node:fs');
        const source='/run/secrets/openbao_approle_secret_id';
        const target='/run/agent-secrets/openbao_approle_secret_id';
        fs.copyFileSync(source,target);
        fs.chmodSync(target,0o400)
    restart: "no"
    security_opt: [no-new-privileges:true]
    secrets:
      - source: openbao_approle_secret_id
        target: openbao_approle_secret_id
        uid: "1000"
        gid: "1000"
        mode: 0400
    user: "1000:1000"
    volumes:
      - agent-secrets:/run/agent-secrets

  agent:
    <<: *runtime-security
    depends_on:
      agent-secret-init:
        condition: service_completed_successfully
    image: ghcr.io/arek-e/bob-agent@${BOB_AGENT_IMAGE_DIGEST:?}
    environment:
      ACCESS_TEAM_DOMAIN: ${ACCESS_TEAM_DOMAIN:?}
      ADMIN_ACCESS_AUDIENCE: ${ADMIN_ACCESS_AUDIENCE:?}
      ADMIN_ACCESS_SUBJECT: ${ADMIN_ACCESS_SUBJECT:?}
      BAO_ADDR: ${BAO_ADDR:?}
      BAO_APPROLE_ROLE_ID: ${BAO_APPROLE_ROLE_ID:?}
      BAO_APPROLE_SECRET_ID_PATH: /run/secrets/openbao_approle_secret_id
      BAO_AUTH_METHOD: approle
      BOB_ALLOWED_MODELS: ${BOB_ALLOWED_MODELS:?}
      BOB_MODEL: ${BOB_MODEL:?}
      BOB_PROVIDER: openai-codex
      BOB_RELEASE_SHA: ${BOB_RELEASE_SHA:?}
      CORE_ACCESS_CLIENT_ID: ${CORE_ACCESS_CLIENT_ID:?}
      CORE_ACCESS_CLIENT_SECRET: ${CORE_ACCESS_CLIENT_SECRET:?}
      CORE_URL: ${CORE_URL:?}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?}
      PORT: "8787"
      RUN_ACCESS_AUDIENCE: ${RUN_ACCESS_AUDIENCE:?}
      RUN_ACCESS_SUBJECT: ${RUN_ACCESS_SUBJECT:?}
    expose: ["8787"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [runtime]
    tmpfs:
      - /tmp:mode=1777,uid=1000,gid=1000
    volumes:
      - agent-secrets:/run/secrets:ro
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M

  tunnel:
    <<: *runtime-security
    image: docker.io/cloudflare/cloudflared@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
    command: [tunnel, --no-autoupdate, --protocol, http2, run]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN:?}
    depends_on:
      agent:
        condition: service_healthy
      nango:
        condition: service_healthy
    networks: [runtime]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  nango:
    <<: *runtime-security
    image: docker.io/nangohq/nango-server@sha256:a52964a41b5ff5d113e45d8ae76a6ffeb2b76ed6e147bc5078288d0f0c79f0c6
    user: "1000:1000"
    environment:
      FLAG_AUTH_ENABLED: "false"
      FLAG_SERVE_CONNECT_UI: "true"
      LOG_LEVEL: info
      NANGO_ADMIN_KEY: ${NANGO_ADMIN_KEY:?}
      NANGO_CONNECT_UI_PORT: "3009"
      NANGO_DASHBOARD_PASSWORD: ${NANGO_DASHBOARD_PASSWORD:?}
      NANGO_DASHBOARD_USERNAME: ${NANGO_DASHBOARD_USERNAME:?}
      NANGO_DB_HOST: ${NANGO_DB_HOST:?}
      NANGO_DB_NAME: nango
      NANGO_DB_PASSWORD: ${NANGO_DB_PASSWORD:?}
      NANGO_DB_POOL_MAX: "10"
      NANGO_DB_POOL_MIN: "0"
      NANGO_DB_PORT: ${NANGO_DB_PORT:-5432}
      NANGO_DB_SSL: "false"
      NANGO_DB_USER: ${NANGO_DB_USER:-nango}
      NANGO_ENCRYPTION_KEY: ${NANGO_ENCRYPTION_KEY:?}
      NANGO_LOGS_ENABLED: "false"
      NANGO_MIGRATE_AT_START: "true"
      NANGO_PROXY_BASE_URL_OVERRIDE_ENABLED: "false"
      NANGO_PUBLIC_CONNECT_URL: ${NANGO_PUBLIC_CONNECT_URL:?}
      NANGO_PUBLIC_SERVER_URL: ${NANGO_PUBLIC_SERVER_URL:?}
      NANGO_REDIS_URL: redis://nango-redis:6379
      NANGO_SECRET_KEY_DEV: ${NANGO_SECRET_KEY_DEV:?}
      NANGO_SERVER_URL: ${NANGO_SERVER_URL:?}
      NANGO_TELEMETRY_SDK: "false"
      RECORDS_DATABASE_URL: ${NANGO_RECORDS_DATABASE_URL:?}
      SERVER_PORT: "3003"
      TELEMETRY: "false"
    expose: ["3003", "3009"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3003/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      nango-redis:
        condition: service_healthy
    networks: [runtime, coolify]
    tmpfs:
      - /tmp:mode=1777,uid=1000,gid=1000
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M

  nango-redis:
    <<: *runtime-security
    image: docker.io/library/redis@sha256:05a97a479bc73de66f087dc05b569010772880f778cc8671fa6b8aadee32e5c6
    user: "999:999"
    command: [redis-server, --save, "", --appendonly, "no"]
    expose: ["6379"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [runtime]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.025"
          memory: 64M

  backup-runner:
    <<: *runtime-security
    image: ghcr.io/arek-e/bob-data-backup@${BOB_BACKUP_IMAGE_DIGEST:?}
    command: [sh, -c, "trap 'exit 0' TERM INT; while :; do sleep 86400; done"]
    environment:
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?}
      BACKUP_COPY_ACCESS_KEY_ID: ${BACKUP_COPY_ACCESS_KEY_ID:?}
      BACKUP_COPY_BUCKET: ${BACKUP_COPY_BUCKET:?}
      BACKUP_COPY_ENDPOINT: ${BACKUP_COPY_ENDPOINT:?}
      BACKUP_COPY_PREFIX: ${BACKUP_COPY_PREFIX:-bob}
      BACKUP_COPY_REGION: ${BACKUP_COPY_REGION:?}
      BACKUP_COPY_SECRET_ACCESS_KEY: ${BACKUP_COPY_SECRET_ACCESS_KEY:?}
      BACKUP_MAX_BYTES: "268435456"
      BACKUP_MIGRATIONS_DIRECTORY: ../../apps/core-worker/migrations
      BACKUP_OUTPUT_DIRECTORY: /backups
      BACKUP_RESTORE_BUCKET_PREFIX: bob-restore-drill
      BACKUP_RESTORE_DATABASE_PREFIX: bob-restore-drill
      BACKUP_RETENTION_COUNT: "42"
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:?}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_BACKUP_API_TOKEN:?}
      CLOUDFLARE_D1_DATABASE_ID: ${CLOUDFLARE_D1_DATABASE_ID:?}
      R2_ACCESS_KEY_ID: ${R2_BACKUP_ACCESS_KEY_ID:?}
      R2_BUCKET: ${R2_BUCKET:?}
      R2_ENDPOINT: ${R2_ENDPOINT:?}
      R2_SECRET_ACCESS_KEY: ${R2_BACKUP_SECRET_ACCESS_KEY:?}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const fs=require('node:fs');const p='/backups';const n=fs.readdirSync(p).filter(x=>/^bob-.*\.json\.gz\.age$/.test(x));if(n.length===0)process.exit(1);const newest=Math.max(...n.map(x=>fs.statSync(p+'/'+x).mtimeMs));if(Date.now()-newest>18000000)process.exit(1)
      interval: 5m
      timeout: 5s
      retries: 1
      start_period: 10m
    networks: [runtime]
    tmpfs:
      - /tmp:mode=1777,uid=1000,gid=1000
    volumes:
      - bob-backups:/backups
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 128M

  observer:
    <<: *runtime-security
    image: docker.io/otel/opentelemetry-collector-contrib@sha256:388054389612c69d0387ecac256338e4086f6cf072fc8feafb6ce7968dc6946c
    user: "10001:10001"
    command: [--config=env:OTEL_CONFIG]
    environment:
      NANGO_DB_HOST: ${NANGO_DB_HOST:?}
      NANGO_DB_PORT: ${NANGO_DB_PORT:-5432}
      OTEL_CONFIG: *observer-config
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?}
    group_add: ["988"]
    networks: [runtime, coolify]
    volumes:
      - /:/hostfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /data/coolify/backups/databases/root-team-0/bob-nango-postgres-g60dc8bcxunc34j7wg47fvov:/nango-backups:ro
      - bob-backups:/backups:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 128M

networks:
  runtime:
  coolify:
    external: true

volumes:
  agent-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=1000,gid=1000,mode=0700
  bob-backups:

secrets:
  openbao_approle_secret_id:
    environment: BAO_APPROLE_SECRET_ID
