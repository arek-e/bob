extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  host_metrics:
    collection_interval: 30s
    root_path: /hostfs
    scrapers:
      cpu:
      disk:
      filesystem:
        exclude_fs_types:
          fs_types:
            [
              autofs,
              binfmt_misc,
              cgroup2,
              configfs,
              debugfs,
              devpts,
              devtmpfs,
              fusectl,
              hugetlbfs,
              mqueue,
              overlay,
              proc,
              pstore,
              securityfs,
              squashfs,
              sysfs,
              tracefs
            ]
          match_type: strict
      load:
        cpu_average: true
      memory:
      network:
      paging:
      processes:
      system:

  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 30s
    timeout: 10s
    container_labels_to_metric_labels:
      com.docker.compose.service: bob_service
      coolify.managed: coolify_managed
    metrics:
      container.memory.fails:
        enabled: true
      container.restarts:
        enabled: true
      container.uptime:
        enabled: true

  http_check:
    collection_interval: 30s
    metrics:
      httpcheck.response.duration:
        enabled: true
      httpcheck.tls.cert_remaining:
        enabled: true
    targets:
      - endpoints:
          - http://agent:8787/health
          - http://nango:3003/health
          - http://coolify:8080/api/health
          - https://nango.tpops.dev/health
          - https://bob-agent.tpops.dev/health

  tcp_check:
    collection_interval: 30s
    targets:
      - endpoint: ${env:NANGO_DB_HOST}:${env:NANGO_DB_PORT}
        dialer:
          timeout: 5s
      - endpoint: nango-redis:6379
        dialer:
          timeout: 5s

  file_stats/bob_backup:
    include: /backups
    collection_interval: 1m

  file_stats/nango_backup:
    include: /nango-backups
    collection_interval: 1m

  prometheus/collector:
    config:
      scrape_configs:
        - job_name: bob-coolify-observer
          scrape_interval: 30s
          static_configs:
            - targets: [127.0.0.1:8888]

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 384
    spike_limit_mib: 96
  resource:
    attributes:
      - action: upsert
        key: deployment.environment.name
        value: prod
      - action: upsert
        key: host.name
        value: bob-coolify
      - action: upsert
        key: service.name
        value: bob-coolify-observer
      - action: upsert
        key: service.namespace
        value: bob
  resource/bob_backup:
    attributes:
      - action: upsert
        key: backup.type
        value: bob
  resource/nango_backup:
    attributes:
      - action: upsert
        key: backup.type
        value: nango
  transform/bob_backup:
    error_mode: propagate
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["backup_type"], "bob")
  transform/nango_backup:
    error_mode: propagate
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["backup_type"], "nango")
  batch: {}

exporters:
  otlp_http/platform:
    endpoint: ${env:OTEL_EXPORTER_OTLP_ENDPOINT}
    timeout: 5s

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers:
        - host_metrics
        - docker_stats
        - http_check
        - tcp_check
        - prometheus/collector
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_http/platform]
    metrics/bob_backup:
      receivers: [file_stats/bob_backup]
      processors: [memory_limiter, resource, resource/bob_backup, transform/bob_backup, batch]
      exporters: [otlp_http/platform]
    metrics/nango_backup:
      receivers: [file_stats/nango_backup]
      processors: [memory_limiter, resource, resource/nango_backup, transform/nango_backup, batch]
      exporters: [otlp_http/platform]
  telemetry:
    logs:
      level: warn
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
