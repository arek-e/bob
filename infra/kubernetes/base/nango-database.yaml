apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bob-nango-postgres
  namespace: bob
spec:
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bob-nango-db
  namespace: bob
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bob-nango-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bob-nango-db
    spec:
      serviceAccountName: bob-nango
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: nango-postgres.invalid/repository
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: nango
            - name: POSTGRES_DB
              value: nango
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bob-nango-runtime
                  key: NANGO_DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: [pg_isready, -U, nango, -d, nango]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [pg_isready, -U, nango, -d, nango]
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bob-nango-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: bob-nango-db
  namespace: bob
spec:
  selector:
    app.kubernetes.io/name: bob-nango-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  type: ClusterIP
