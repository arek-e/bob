apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: bob-nango-openbao
  namespace: bob
spec:
  provider:
    vault:
      server: "${OPENBAO_ADDR}"
      path: ops
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: bob-nango-secret-delivery
          serviceAccountRef:
            name: bob-nango-secret-delivery
            audiences: [openbao]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bob-nango-runtime
  namespace: bob
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: bob-nango-openbao
  target:
    name: bob-nango-runtime
    creationPolicy: Owner
  data:
    - secretKey: NANGO_ENCRYPTION_KEY
      remoteRef:
        key: apps/prod/bob/nango/runtime
        property: NANGO_ENCRYPTION_KEY
    - secretKey: NANGO_SECRET_KEY_DEV
      remoteRef:
        key: apps/prod/bob/nango/runtime
        property: NANGO_SECRET_KEY
    - secretKey: NANGO_ADMIN_KEY
      remoteRef:
        key: apps/prod/bob/nango/runtime
        property: NANGO_ADMIN_KEY
    - secretKey: NANGO_DASHBOARD_USERNAME
      remoteRef:
        key: apps/prod/bob/nango/runtime
        property: NANGO_DASHBOARD_USERNAME
    - secretKey: NANGO_DASHBOARD_PASSWORD
      remoteRef:
        key: apps/prod/bob/nango/runtime
        property: NANGO_DASHBOARD_PASSWORD
    - secretKey: NANGO_DB_PASSWORD
      remoteRef:
        key: apps/prod/bob/nango/runtime
        property: NANGO_DB_PASSWORD
