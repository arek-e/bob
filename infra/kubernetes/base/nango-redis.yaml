apiVersion: apps/v1
kind: Deployment
metadata:
  name: bob-nango-redis
  namespace: bob
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bob-nango-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bob-nango-redis
    spec:
      serviceAccountName: bob-nango
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: nango-redis.invalid/repository
          imagePullPolicy: IfNotPresent
          args: [redis-server, --save, "", --appendonly, "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: bob-nango-redis
  namespace: bob
spec:
  selector:
    app.kubernetes.io/name: bob-nango-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  type: ClusterIP
