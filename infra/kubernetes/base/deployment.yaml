apiVersion: apps/v1
kind: Deployment
metadata:
  name: bob-agent
  namespace: bob
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bob-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bob-agent
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      serviceAccountName: bob-agent
      imagePullSecrets:
        - name: bob-ghcr-pull
      containers:
        - name: agent
          image: bob-agent.invalid/repository
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
          envFrom:
            - configMapRef:
                name: bob-agent-bootstrap
            - secretRef:
                name: bob-agent-bootstrap
                optional: false
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: temporary
              mountPath: /tmp
            - name: openbao-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        - name: tunnel
          image: cloudflared.invalid/repository
          imagePullPolicy: IfNotPresent
          args: [tunnel, --no-autoupdate, --protocol, http2, run, --token, $(TUNNEL_TOKEN)]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bob-agent-tunnel
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: temporary
          emptyDir: {}
        - name: openbao-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  audience: openbao
                  expirationSeconds: 600
                  path: token
