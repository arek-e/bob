apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bob-agent-reviewed-fqdn-egress
  namespace: bob
  annotations:
    bob.openai.dev/requires-cilium-fqdn-enforcement: "true"
    bob.openai.dev/render-required: "true"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: bob-agent
  egress:
    - toFQDNs:
        - matchName: api.openai.com
        - matchName: auth.openai.com
        - matchName: chatgpt.com
        - matchPattern: "*.chatgpt.com"
        - matchPattern: "*.cloudflareaccess.com"
        - matchName: region1.v2.argotunnel.com
        - matchName: region2.v2.argotunnel.com
        - matchName: "${BOB_CORE_FQDN}"
        - matchName: "${OPENBAO_FQDN}"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
