apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: bob-backup-openbao
  namespace: bob
spec:
  provider:
    vault:
      server: "${OPENBAO_ADDR}"
      path: ops
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: bob-backup-secret-delivery
          serviceAccountRef:
            name: bob-backup-secret-delivery
            audiences: [openbao]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bob-backup-runtime
  namespace: bob
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: bob-backup-openbao
  target:
    name: bob-backup-runtime
    creationPolicy: Owner
  data:
    - secretKey: CLOUDFLARE_ACCOUNT_ID
      remoteRef:
        key: "apps/prod/bob/backup/runtime"
        property: CLOUDFLARE_ACCOUNT_ID
    - secretKey: CLOUDFLARE_D1_DATABASE_ID
      remoteRef:
        key: "apps/prod/bob/backup/runtime"
        property: CLOUDFLARE_D1_DATABASE_ID
    - secretKey: CLOUDFLARE_API_TOKEN
      remoteRef:
        key: "apps/prod/bob/backup/runtime"
        property: CLOUDFLARE_API_TOKEN
    - secretKey: R2_BUCKET
      remoteRef:
        key: "apps/prod/bob/backup/runtime"
        property: R2_BUCKET
    - secretKey: R2_ENDPOINT
      remoteRef:
        key: "apps/prod/bob/backup/runtime"
        property: R2_ENDPOINT
    - secretKey: R2_ACCESS_KEY_ID
      remoteRef:
        key: "apps/prod/bob/backup/runtime"
        property: R2_ACCESS_KEY_ID
    - secretKey: R2_SECRET_ACCESS_KEY
      remoteRef:
        key: "apps/prod/bob/backup/runtime"
        property: R2_SECRET_ACCESS_KEY
    - secretKey: BACKUP_AGE_RECIPIENT
      remoteRef:
        key: "apps/prod/bob/backup/runtime"
        property: BACKUP_AGE_RECIPIENT
