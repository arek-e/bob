apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: bob-openbao
  namespace: bob
spec:
  provider:
    vault:
      server: "${OPENBAO_ADDR}"
      path: ops
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: bob-agent-secret-delivery
          serviceAccountRef:
            name: bob-agent-secret-delivery
            audiences: [openbao]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bob-agent-bootstrap
  namespace: bob
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: bob-openbao
  target:
    name: bob-agent-bootstrap
    creationPolicy: Owner
  data:
    - secretKey: RUN_ACCESS_AUDIENCE
      remoteRef:
        key: "apps/prod/bob/access/core-to-agent"
        property: RUN_ACCESS_AUDIENCE
    - secretKey: RUN_ACCESS_SUBJECT
      remoteRef:
        key: "apps/prod/bob/access/core-to-agent"
        property: RUN_ACCESS_SUBJECT
    - secretKey: ADMIN_ACCESS_AUDIENCE
      remoteRef:
        key: "apps/prod/bob/access/core-to-agent-admin"
        property: ADMIN_ACCESS_AUDIENCE
    - secretKey: ADMIN_ACCESS_SUBJECT
      remoteRef:
        key: "apps/prod/bob/access/core-to-agent-admin"
        property: ADMIN_ACCESS_SUBJECT
    - secretKey: CORE_URL
      remoteRef:
        key: "apps/prod/bob/access/agent-to-core"
        property: CORE_URL
    - secretKey: CORE_ACCESS_CLIENT_ID
      remoteRef:
        key: "apps/prod/bob/access/agent-to-core"
        property: CORE_ACCESS_CLIENT_ID
    - secretKey: CORE_ACCESS_CLIENT_SECRET
      remoteRef:
        key: "apps/prod/bob/access/agent-to-core"
        property: CORE_ACCESS_CLIENT_SECRET
    - secretKey: ACCESS_TEAM_DOMAIN
      remoteRef:
        key: "apps/prod/bob/access/agent-to-core"
        property: ACCESS_TEAM_DOMAIN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bob-agent-tunnel
  namespace: bob
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: bob-openbao
  target:
    name: bob-agent-tunnel
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: "apps/prod/bob/tunnel/agent-host"
        property: TUNNEL_TOKEN
